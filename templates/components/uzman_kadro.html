<section class="blog-section" style="order: 1; padding-bottom: 2rem;">
    <div class="section-header"><h2>Uzman Kadromuz</h2></div>
    <div class="blog-grid">
        {% for expert in experts %}
            <div class="expert-card" onclick="openExpertDetailModal('{{ expert.name }}', '{{ expert.role }}', '{{ expert.email }}', '{{ expert.cv }}', '{{ expert.photo }}')" style="cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
                <div>
                    <div class="expert-photo">{{ expert.photo }}</div>
                    <h3 style="text-align: center; font-size: 1.4rem;">{{ expert.name }}</h3>
                    <div style="text-align: center; margin-bottom: 1rem;"><span class="role-badge">{{ expert.role }}</span></div>
                    
                    <div style="font-size: 0.85rem; color: var(--text-primary); background: var(--bg-base); padding: 1.2rem; border-radius: 12px; border-left: 4px solid var(--accent-warm); margin-bottom: 1rem; line-height: 1.6; max-height: 120px; overflow: hidden; position: relative;">
                        <strong style="display: block; margin-bottom: 0.4rem; color: var(--accent-warm);">Sistem Onaylı CV & Kariyer</strong>
                        {{ expert.cv if expert.cv else 'Akademik geçmiş ve kariyer detayları sisteme yükleniyor...' }}
                        <div style="font-size: 0.75rem; color: var(--accent-warm); margin-top: 0.5rem; font-weight: 600; text-align: right;">Detayları Gör →</div>
                    </div>
                </div>
                <button class="btn-outline" style="width: 100%; margin-top: auto;" onclick="event.stopPropagation(); openAppointmentModal('{{ expert.username }}')">Randevu Al</button>
                <div style="text-align: center; margin-top: 3rem; padding: 2rem; background: var(--bg-base); border-radius: 16px; border: 1px dashed var(--accent-warm);">
                 <h4 style="font-family: var(--font-serif); font-size: 1.6rem; margin-bottom: 0.5rem;">Ekibimize Katılmak İster Misiniz?</h4>
                 <button class="btn-follow" onclick="openModal('applyExpertModal')">Uzman Başvuru Formu</button>
               </div>
        {% endfor %}
    </div>
</section>
