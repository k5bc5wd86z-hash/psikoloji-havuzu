<!-- İLETİŞİM FORMU -->
<section class="blog-section" style="order: 3; padding-bottom: 3rem;">
     <div class="dashboard-card" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
        <h3 style="font-family: var(--font-serif); font-size: 1.8rem; margin-bottom: 1rem; text-align: center;">Bize Ulaşın</h3>
        <form action="/send_contact" method="POST">
            <input type="text" name="name" class="editor-input" placeholder="Adınız Soyadınız" required style="margin-bottom: 1rem;">
            <input type="email" name="email" class="editor-input" placeholder="E-posta Adresiniz" required style="margin-bottom: 1rem;">
            <textarea name="message" class="editor-textarea" placeholder="Mesajınızı buraya yazın..." required style="min-height: 120px; margin-bottom: 1rem;"></textarea>
            <button type="submit" class="btn-follow" style="width: 100%;">Mesaj Gönder</button>
        </form>
    </div>
</section>
