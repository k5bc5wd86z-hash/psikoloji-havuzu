<header>
    <div class="nav-container">
        <a href="/" style="text-decoration: none; color: var(--text-primary); font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; gap: 0.6rem;">
            <!-- Yeni PNG Logomuz -->
            <img src="{{ url_for('static', filename='images.png') }}" alt="Psikoloji Havuzu Logosu" style="height: 36px; width: auto; object-fit: contain;">
            Psikoloji Havuzu
        </a>
       
        <ul class="nav-links">
            <li><a href="/">Ana Sayfa</a></li>
            <li><a href="#icerik-alani">Keşfet</a></li>
        </ul>
        
        <div style="display: flex; align-items: center; gap: 1rem;">
            <!-- Yazısız, Saf ve Şık Gece/Gündüz Yuvarlak Toggle Butonu -->
            <button onclick="toggleDarkMode()" style="width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--text-primary); background: var(--bg-card); cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'"></button>
            
           {% if session_user %}
                <span style="font-size: 0.85rem; font-weight: 600;">{{ session_name }}</span>
                {% if session_role == 'Kurucu Yönetici' or session_role == 'Sistem Yöneticisi' %}
                    <a href="/admin_dashboard" class="btn-outline" style="padding: 0.4rem 1rem; font-size: 0.8rem;">Yönetici Paneli</a>
                {% endif %}
                <a href="/logout" class="btn-follow" style="background: #c94a4a; padding: 0.4rem 1rem; font-size: 0.8rem;">Çıkış</a>
            {% else %}
                <button class="btn-outline" onclick="openModal('adminModal')">Giriş Yap</button>
            {% endif %}
        </div>
    </div>
</header>
