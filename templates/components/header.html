<header>
    <div class="nav-container">
        <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary);">
            <img src="{{ url_for('static', filename='images.png') }}" alt="Psikoloji Havuzu Logo" style="width: 40px; height: 40px; object-fit: contain; mix-blend-mode: multiply; filter: contrast(120%);">
            <span style="font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px;">Psikoloji Havuzu</span>
        </a>
       
        <ul class="nav-links">
            <li><a href="/">Ana Sayfa</a></li>
            <li><a href="#icerik-alani">Keşfet</a></li>
        </ul>
        
        <div style="display: flex; align-items: center; gap: 0.8rem;">
            <button onclick="toggleDarkMode()" style="background:transparent; border:none; font-size:1.4rem; cursor:pointer;" id="themeToggle">🌙</button>
            
            {% if session_user %}
                <span style="font-size: 0.85rem; font-weight: 600;">{{ session_name }}</span>
                <a href="/logout" class="btn-follow" style="background: #c94a4a; padding: 0.4rem 1rem; font-size: 0.8rem;">Çıkış</a>
            {% else %}
                <button class="btn-outline" onclick="openModal('adminModal')">Giriş Yap</button>
                <button class="btn-follow" onclick="openModal('registerModal')">Kayıt Ol</button>
            {% endif %}
        </div>
    </div>
</header>
