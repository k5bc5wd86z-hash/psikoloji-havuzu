<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 VIP Kontrol Merkezi</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Courier New', Courier, monospace; text-align: center; padding: 40px 20px; }
        .vip-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 900px; margin: 0 auto; }
        .vip-box { background: #111; border: 2px solid #d4af37; border-radius: 15px; padding: 25px; flex: 1; min-width: 300px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); }
        .danger-box { border-color: #ff3333; box-shadow: 0 0 20px rgba(255, 51, 51, 0.15); }
        input { display: block; width: 90%; margin: 10px auto; padding: 10px; background: #222; border: 1px solid #d4af37; color: white; border-radius: 5px; }
        .btn { background: #d4af37; color: #000; font-weight: bold; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px; text-transform: uppercase; margin: 8px 0; width: 100%; transition: 0.2s; }
        .btn:hover { background: #fff; transform: scale(1.02); }
        .btn-danger { background: #ff3333; color: white; }
        .btn-danger:hover { background: #ff6666; color: black; }
        .btn-warning { background: #ff9900; color: black; }
        .btn-success { background: #28a745; color: white; }
        a { color: #888; text-decoration: none; display: inline-block; margin-top: 30px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>👑 HOŞ GELDİN SUNAY SILA TAŞDEMİR 👑</h1>
    <p style="color: #888; margin-bottom: 30px;">Baş Kurucu İkincil Düzey Yetki Paneli & Komuta Merkezi</p>
    
    <div class="vip-container">
        <!-- VIP Üye Ekleme Paneli -->
        <div class="vip-box">
            <h3 style="color: #fff; margin-top: 0;">⚡ Doğrudan Üye Kaydı</h3>
            <form action="/founder_direct_add" method="POST">
                <input type="text" name="mName" placeholder="Ad Soyad" required>
                <input type="text" name="mUser" placeholder="Kullanıcı Adı" required>
                <input type="password" name="mPass" placeholder="Şifre" required>
                <button type="submit" class="btn">Sisteme Ekle</button>
            </form>
        </div>

        <!-- Nükleer Komuta Paneli (Butonlar) -->
        <div class="vip-box danger-box">
            <h3 style="color: #ff3333; margin-top: 0;">☢️ Nükleer Komutlar</h3>
            <p style="color: #aaa; font-size: 0.85rem;">Tek tıkla sistem geneli işlem yapın:</p>
            
            <a href="/sila_panel_action?cmd=sistemi_cokert" style="margin: 0; width: 100%; text-decoration: none;">
                <button class="btn btn-danger">💀 Sistemi Çökert</button>
            </a>
            <a href="/sila_panel_action?cmd=sistemi_kurtar" style="margin: 0; width: 100%; text-decoration: none;">
                <button class="btn btn-success">🛡️ Sistemi Kurtar</button>
            </a>
            <a href="/sila_panel_action?cmd=yetkileri_al" style="margin: 0; width: 100%; text-decoration: none;">
                <button class="btn btn-warning">🔒 Uzman Yetkilerini Al</button>
            </a>
            <a href="/sila_panel_action?cmd=uzmanlari_at" style="margin: 0; width: 100%; text-decoration: none;">
                <button class="btn btn-danger" style="background: #990000;">❌ Tüm Uzmanları At</button>
            </a>
        </div>
    </div>

    <br>
    <a href="/">← Ana Sayfaya Dön</a>
</body>
</html>
