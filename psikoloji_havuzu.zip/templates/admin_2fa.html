<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Aşamalı Yönetici Güvenlik Doğrulaması</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="modal-card" style="max-width: 420px; text-align: center;">
        <h3 style="font-family: var(--font-serif); font-size: 1.8rem; margin-bottom: 0.5rem;">🔒 3 Adımlı Güvenlik</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">
            1. Şifre Onaylandı.<br>
            2. <strong>Giden_E_Postalar/Yonetici_2FA_Kodu.txt</strong> dosyasına kod gönderildi.<br>
            3. Lütfen ek güvenlik için yöneticinin <strong>göbek adını</strong> giriniz.
        </p>
        <form action="/verify_2fa" method="POST">
            <input type="text" name="code" placeholder="6 Haneli E-posta Kodu" class="editor-input" style="text-align: center; font-size: 1.1rem; letter-spacing: 2px; margin-bottom: 0.8rem;" required>
            <input type="text" name="middleName" placeholder="Yöneticinin Göbek Adı (Örn: Can)" class="editor-input" style="text-align: center; font-size: 1rem; margin-bottom: 1.2rem;" required>
            <button type="submit" class="btn-follow" style="width: 100%;">Tüm Adımları Doğrula & Gir</button>
        </form>
    </div>
</body>
</html>
